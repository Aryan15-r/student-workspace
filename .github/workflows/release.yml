name: Build & Publish Release APK to Public Repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env configuration
        env:
          SUPABASE_URL: "https://fjxnjtcxrxeknkoupvsr.supabase.co"
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqeG5qdGN4cnhla25rb3VwdnNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MzI0NTEsImV4cCI6MjEwNDAwODQ1MX0.5r9Q_KdkwrVf5gdUKlSD-FBNpR5srJaBE0tbYP2IHWw"
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY || 'AQ.Ab8RN6KTb0yUvZ2H5gLzXa9O9c3YDD86pXDSHaX2W2B6y9RbTQ' }}"
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Obfuscated Android Release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Rename APK for release
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk StudySpace-release.apk

      - name: Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "StudySpace ${{ github.ref_name }}"
          body: "Official release build for StudySpace ${{ github.ref_name }}. Download `StudySpace-release.apk` below to install on your Android device."
          files: StudySpace-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
