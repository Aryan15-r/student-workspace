name: student_workspace
description: "StudySpace — An all-in-one student productivity workspace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Backend ──────────────────────────────────────────────
  supabase_flutter: ^2.8.4       # Supabase: auth, database, realtime, storage

  # ── State Management ─────────────────────────────────────
  provider: ^6.1.2               # Simplest, most beginner-friendly option

  # ── Navigation ───────────────────────────────────────────
  go_router: ^14.6.2             # URL-based routing (works on web too)

  # ── UI & Fonts ───────────────────────────────────────────
  google_fonts: ^6.2.1           # Inter + Outfit fonts
  flutter_animate: ^4.5.2        # Smooth micro-animations
  shimmer: ^3.0.0                # Loading skeleton screens
  cached_network_image: ^3.4.1   # Efficient network image loading

  # ── Utilities ────────────────────────────────────────────
  flutter_dotenv: ^5.2.1         # Load .env environment variables
  http: ^1.2.2                   # HTTP requests (AI backend calls)
  intl: ^0.19.0                  # Date/time formatting
  timeago: ^3.7.0                # "5 minutes ago" timestamps
  uuid: ^4.5.1                   # Generate unique IDs
  math_expressions: ^2.6.0       # Parse & evaluate calculator expressions
  file_picker: ^10.3.8            # Pick PDF/files from device (modern Android 36+ support)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env          # Environment variables (gitignored — never committed)
